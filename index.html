<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTI Analytics | Dashboard Ejecutivo B2B & Generación de Demanda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
            boxShadow: {
              'card': '0 2px 12px -2px rgba(16, 24, 40, 0.05), 0 1px 4px -1px rgba(16, 24, 40, 0.03)',
              'card-hover': '0 10px 26px -4px rgba(59, 110, 246, 0.12), 0 2px 8px -2px rgba(16, 24, 40, 0.05)',
            }
          }
        }
      };
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
    <script crossorigin src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="./src/browser-engine.js"></script>
    <style>
      body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #94A3B8; border-radius: 9999px; }
    </style>
  </head>
  <body class="bg-[#F4F6FA] text-slate-800 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useMemo, useRef } = React;
      const {
        SAMPLE_CSV_CONTENT,
        FIELD_META,
        autoDetectColumns,
        buildLeadsFromRawRows,
        generateSemanticSuggestions,
        applyMergeRulesToLeads,
        filterLeads,
        calculateDashboardAggregations,
        exportLeadsToCSV,
        exportElementAsHDImage,
        safeRate,
      } = window.MTIEngine;

      // ============================================================================
      // SVG VISUAL COMPONENTS (HIGH-CONTRAST LIGHT & DARK MODE)
      // ============================================================================
      const SparklineSVG = ({ points, positive }) => {
        const width = 94, height = 36;
        const min = Math.min(...points, 0), max = Math.max(...points, 100);
        const range = Math.max(max - min, 1);
        const coords = points.map((val, idx) => ({
          x: (idx / Math.max(points.length - 1, 1)) * (width - 8) + 4,
          y: height - 5 - ((val - min) / range) * (height - 10),
        }));
        const pathData = coords.map((pt, i) => `${i === 0 ? 'M' : 'L'} ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`).join(' ');
        const areaData = `${pathData} L ${coords[coords.length - 1].x.toFixed(1)} ${height} L ${coords[0].x.toFixed(1)} ${height} Z`;
        const strokeColor = positive ? '#10B981' : '#F59E0B';
        const gradId = useMemo(() => `sp-${Math.random().toString(36).slice(2, 8)}`, []);
        return (
          <svg width={width} height={height} className="overflow-visible">
            <defs>
              <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor={strokeColor} stopOpacity="0.25" />
                <stop offset="100%" stopColor={strokeColor} stopOpacity="0.0" />
              </linearGradient>
            </defs>
            <path d={areaData} fill={`url(#${gradId})`} />
            <path d={pathData} fill="none" stroke={strokeColor} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        );
      };

      const ComparativeBarChartSVG = ({ data, selectedCountry, onSelectCountry, darkMode }) => {
        const items = data.slice(0, 7);
        const maxVal = Math.max(...items.map((d) => Math.max(d.interesados, d.reuniones)), 4);
        return (
          <div className="h-56 flex flex-col justify-end pt-3 select-none">
            <div className={`flex-1 flex items-end justify-around gap-2 border-b pb-2 px-2 ${darkMode ? 'border-slate-800' : 'border-slate-100'}`}>
              {items.map((item) => {
                const hInt = Math.max(8, Math.round((item.interesados / maxVal) * 150));
                const hMeet = Math.max(6, Math.round((item.reuniones / maxVal) * 150));
                const isSelected = selectedCountry === item.pais;
                return (
                  <div
                    key={item.pais}
                    onClick={() => onSelectCountry(isSelected ? 'ALL' : item.pais)}
                    className={`group flex flex-col items-center cursor-pointer transition-all px-2 py-1 rounded-xl ${
                      isSelected ? 'bg-blue-500/15 ring-1 ring-blue-400' : 'hover:bg-slate-500/10'
                    }`}
                    title={`${item.pais}: ${item.interesados} Interesados | ${item.reuniones} Reuniones`}
                  >
                    <div className="text-[10px] font-bold text-slate-400 mb-1">
                      {item.interesados}/{item.reuniones}
                    </div>
                    <div className="flex items-end gap-1.5 h-[155px]">
                      <div style={{ height: `${hInt}px` }} className="w-3.5 sm:w-4 bg-[#3B6EF6] rounded-t-md transition-all" />
                      <div style={{ height: `${hMeet}px` }} className="w-3.5 sm:w-4 bg-[#4CC9B0] rounded-t-md transition-all" />
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="flex justify-around pt-2 px-2">
              {items.map((item) => (
                <span key={item.pais} className="text-[11px] font-semibold text-slate-400 truncate max-w-[74px] text-center">
                  {item.pais}
                </span>
              ))}
            </div>
          </div>
        );
      };

      const DonutChartSVG = ({ data, totalInterested, onSelectIndustry, selectedIndustry, darkMode }) => {
        const size = 180, cx = size / 2, cy = size / 2, r = 62;
        const circumference = 2 * Math.PI * r;
        let acc = 0;
        return (
          <div className="relative flex items-center justify-center">
            <svg width={size} height={size} className="-rotate-90">
              {data.length === 0 ? (
                <circle cx={cx} cy={cy} r={r} fill="none" stroke={darkMode ? '#1E293B' : '#E2E8F0'} strokeWidth="22" />
              ) : (
                data.map((slice) => {
                  const pct = totalInterested > 0 ? slice.interesados / totalInterested : 0;
                  const dash = Math.max(0, pct * circumference - 3);
                  const offset = -acc * circumference;
                  acc += pct;
                  const isSel = selectedIndustry === slice.industria;
                  return (
                    <circle
                      key={slice.industria}
                      cx={cx}
                      cy={cy}
                      r={r}
                      fill="none"
                      stroke={slice.color}
                      strokeWidth={isSel ? '26' : '22'}
                      strokeDasharray={`${dash} ${circumference}`}
                      strokeDashoffset={offset}
                      onClick={() => onSelectIndustry(isSel ? 'ALL' : slice.industria)}
                      className="cursor-pointer transition-all hover:opacity-90"
                    >
                      <title>{`${slice.industria}: ${slice.interesados} (${slice.percentage}%)`}</title>
                    </circle>
                  );
                })
              )}
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
              <span className={`text-3xl font-extrabold leading-none ${darkMode ? 'text-white' : 'text-slate-900'}`}>{totalInterested}</span>
              <span className="text-[11px] font-medium text-slate-400 mt-1">Interesados</span>
            </div>
          </div>
        );
      };

      const SemicircleGaugeSVG = ({ qualRate, qualified, pending, disqualified, darkMode }) => {
        const total = Math.max(qualified + pending + disqualified, 1);
        const r = 72, arcLength = Math.PI * r;
        const pDisq = (disqualified / total) * arcLength;
        const pPend = (pending / total) * arcLength;
        const pQual = (qualified / total) * arcLength;
        return (
          <div className="relative flex flex-col items-center justify-center pt-1">
            <svg width="204" height="118" viewBox="0 0 210 122">
              <path d="M 31 105 A 74 74 0 0 1 179 105" fill="none" stroke={darkMode ? '#1E293B' : '#F1F5F9'} strokeWidth="18" strokeLinecap="round" />
              <path d="M 31 105 A 74 74 0 0 1 179 105" fill="none" stroke="#F5B041" strokeWidth="18" strokeDasharray={`${pDisq} ${arcLength * 2}`} strokeDashoffset="0" />
              <path d="M 31 105 A 74 74 0 0 1 179 105" fill="none" stroke="#4CC9B0" strokeWidth="18" strokeDasharray={`${pPend} ${arcLength * 2}`} strokeDashoffset={-pDisq} />
              <path d="M 31 105 A 74 74 0 0 1 179 105" fill="none" stroke="#3B6EF6" strokeWidth="18" strokeDasharray={`${pQual} ${arcLength * 2}`} strokeDashoffset={-(pDisq + pPend)} />
            </svg>
            <div className="-mt-11 text-center">
              <span className="block text-[10px] font-bold uppercase tracking-wider text-slate-400">Tasa MTI</span>
              <span className={`text-2xl sm:text-3xl font-extrabold ${darkMode ? 'text-white' : 'text-slate-900'}`}>{qualRate.toFixed(1)}%</span>
            </div>
          </div>
        );
      };

      const SmoothTimelineAreaSVG = ({ series, darkMode }) => {
        const width = 540, height = 205, padX = 28, padY = 22;
        const pts = series.length > 1 ? series : [
          { label: '18 Sep', interesados: 5, reuniones: 4 },
          { label: '25 Sep', interesados: 6, reuniones: 4 },
          { label: '04 Oct', interesados: 7, reuniones: 5 },
          { label: '11 Oct', interesados: 8, reuniones: 6 },
          { label: '18 Oct', interesados: 11, reuniones: 9 },
        ];
        const maxY = Math.max(...pts.map((d) => Math.max(d.interesados, d.reuniones)), 5);
        const getCoords = (key) =>
          pts.map((d, i) => ({
            x: padX + (i / Math.max(pts.length - 1, 1)) * (width - padX * 2),
            y: height - padY - (d[key] / maxY) * (height - padY * 2.2),
            val: d[key],
            label: d.label,
          }));
        const buildSmoothPath = (coords) => {
          if (!coords.length) return '';
          if (coords.length === 1) return `M ${coords[0].x} ${coords[0].y}`;
          let d = `M ${coords[0].x.toFixed(1)} ${coords[0].y.toFixed(1)}`;
          for (let i = 0; i < coords.length - 1; i++) {
            const p0 = coords[i], p1 = coords[i + 1];
            const cpx = p0.x + (p1.x - p0.x) / 2;
            d += ` C ${cpx.toFixed(1)} ${p0.y.toFixed(1)}, ${cpx.toFixed(1)} ${p1.y.toFixed(1)}, ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`;
          }
          return d;
        };
        const intCoords = getCoords('interesados'), meetCoords = getCoords('reuniones');
        const intLine = buildSmoothPath(intCoords), meetLine = buildSmoothPath(meetCoords);
        const baseY = height - padY;
        const intArea = `${intLine} L ${intCoords[intCoords.length - 1].x.toFixed(1)} ${baseY} L ${intCoords[0].x.toFixed(1)} ${baseY} Z`;
        const meetArea = `${meetLine} L ${meetCoords[meetCoords.length - 1].x.toFixed(1)} ${baseY} L ${meetCoords[0].x.toFixed(1)} ${baseY} Z`;

        return (
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-56">
            <defs>
              <linearGradient id="areaInt" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#3B6EF6" stopOpacity="0.3" />
                <stop offset="100%" stopColor="#3B6EF6" stopOpacity="0.0" />
              </linearGradient>
              <linearGradient id="areaMeet" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#4CC9B0" stopOpacity="0.25" />
                <stop offset="100%" stopColor="#4CC9B0" stopOpacity="0.0" />
              </linearGradient>
            </defs>
            {[0.25, 0.5, 0.75, 1].map((r, idx) => {
              const y = baseY - r * (height - padY * 2.2);
              return <line key={idx} x1={padX} y1={y} x2={width - padX} y2={y} stroke={darkMode ? '#1E293B' : '#F1F5F9'} strokeDasharray="4 4" />;
            })}
            <path d={intArea} fill="url(#areaInt)" />
            <path d={meetArea} fill="url(#areaMeet)" />
            <path d={intLine} fill="none" stroke="#3B6EF6" strokeWidth="2.6" strokeLinecap="round" />
            <path d={meetLine} fill="none" stroke="#4CC9B0" strokeWidth="2.6" strokeLinecap="round" />
            {intCoords.map((pt, i) => (
              <g key={i}>
                <circle cx={pt.x} cy={pt.y} r="3.5" fill={darkMode ? '#0F172A' : '#FFFFFF'} stroke="#3B6EF6" strokeWidth="2" />
                <circle cx={meetCoords[i].x} cy={meetCoords[i].y} r="3.5" fill={darkMode ? '#0F172A' : '#FFFFFF'} stroke="#4CC9B0" strokeWidth="2" />
                <text x={pt.x} y={height - 4} textAnchor="middle" fill="#94A3B8" fontSize="10" fontWeight="500">{pt.label}</text>
              </g>
            ))}
          </svg>
        );
      };

      // ============================================================================
      // MAIN DASHBOARD APPLICATION
      // ============================================================================
      const STORAGE_KEYS = {
        LEADS: 'mti_b2b_leads_v2',
        RULES: 'mti_b2b_merge_rules_v2',
        DATASET_NAME: 'mti_b2b_dataset_name_v2',
        BRANDING: 'mti_b2b_branding_v2',
        WEEKLY_REPORT: 'mti_b2b_weekly_report_v2',
        THEME: 'mti_b2b_theme_v2',
      };

      const INITIAL_FILTERS = {
        datePreset: 'all',
        startDate: '2026-09-18',
        endDate: '2026-10-22',
        comparePreviousPeriod: true,
        selectedCountry: 'ALL',
        selectedIndustry: 'ALL',
        selectedRole: 'ALL',
        selectedStage: 'ALL',
        searchQuery: '',
      };

      function App() {
        const csvInputRef = useRef(null);
        const clientLogoInputRef = useRef(null);
        const agencyLogoInputRef = useRef(null);

        // Theme (Light / Dark Mode)
        const [darkMode, setDarkMode] = useState(() => localStorage.getItem(STORAGE_KEYS.THEME) === 'dark');

        // View Mode: 'standard' | 'advanced' | 'infographic'
        const [viewMode, setViewMode] = useState('advanced');

        // Branding (2 Institutional Logos in Top-Right)
        const [branding, setBranding] = useState(() => {
          try {
            const saved = localStorage.getItem(STORAGE_KEYS.BRANDING);
            if (saved) return JSON.parse(saved);
          } catch {}
          return {
            clientName: 'Cliente Enterprise',
            clientLogoUrl: '',
            agencyName: 'MTI Demand Gen',
            agencyLogoUrl: '',
          };
        });
        const [showBrandingModal, setShowBrandingModal] = useState(false);

        // Widget Visibility Flexibility (Hide / Show Individual Boards)
        const [widgets, setWidgets] = useState({
          kpis: true,
          meetingsTable: true,
          qualificationGauge: true,
          countriesChart: true,
          industriesChart: true,
          rolesChart: true,
          timelineChart: true,
          commercialStages: true,
          interestedTable: true,
        });
        const [showWidgetsMenu, setShowWidgetsMenu] = useState(false);

        // Dataset & CSV Mapping
        const [datasetName, setDatasetName] = useState(() => localStorage.getItem(STORAGE_KEYS.DATASET_NAME) || 'sample_b2b_leads.csv');
        const [rawHeaders, setRawHeaders] = useState([]);
        const [rawRows, setRawRows] = useState([]);
        const [columnMapping, setColumnMapping] = useState(() => {
          const parsed = Papa.parse(SAMPLE_CSV_CONTENT, { header: true, skipEmptyLines: true });
          return autoDetectColumns(parsed.meta.fields || []);
        });

        const [mergeRules, setMergeRules] = useState(() => {
          try {
            const saved = localStorage.getItem(STORAGE_KEYS.RULES);
            if (saved) return JSON.parse(saved);
          } catch {}
          return [];
        });

        const [baseLeads, setBaseLeads] = useState(() => {
          try {
            const saved = localStorage.getItem(STORAGE_KEYS.LEADS);
            if (saved) {
              const parsed = JSON.parse(saved);
              if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].fechaEnvioConexion !== undefined) return parsed;
            }
          } catch {}
          const parsedCsv = Papa.parse(SAMPLE_CSV_CONTENT, { header: true, skipEmptyLines: true });
          return buildLeadsFromRawRows(parsedCsv.data, autoDetectColumns(parsedCsv.meta.fields || []));
        });

        // Weekly Tactical Report State (Infographic / Mind Map)
        const [weeklyReport, setWeeklyReport] = useState(() => {
          try {
            const saved = localStorage.getItem(STORAGE_KEYS.WEEKLY_REPORT);
            if (saved) return JSON.parse(saved);
          } catch {}
          return {
            weekTitle: 'Reporte Táctico Semanal de Generación de Demanda B2B',
            dateRangeLabel: 'Semana 15 al 22 de Octubre 2026',
            whatWasDone: [
              'Ejecución de campañas de conexión outbound en cuentas Enterprise (+1,000 empleados) en LATAM y España.',
              'Normalización de industrias clave (Banca / Servicios Financieros y Manufactura) con alta tasa de aceptación.',
              'Coordinación y ejecución de sesiones de descubrimiento con Directores Comerciales, VPs de Ventas y CMOs.',
            ],
            currentPlan: [
              'Secuencias activas de seguimiento sobre prospectos que aceptaron invitación esta semana.',
              'Foco en cuentas de Banca y Manufactura Industrial con dolores de visibilidad de pipeline comercial.',
              'Calificación activa bajo criterios MTI de todas las reuniones ejecutadas.',
            ],
            nextSteps: [
              'Cerrar feedback y calificación de las 8 reuniones agendadas pendientes de evaluación.',
              'Avanzar cuentas en etapa de Presupuesto hacia cierre comercial (Ganada) junto a los líderes técnicos.',
              'Activar nuevo lote de prospección para decisores de Tecnología y Logística.',
            ],
            clientQueries: [
              'Confirmar disponibilidad de agenda de los Directores de Cuenta para las 4 demos técnicas de la próxima semana.',
              'Validar feedback comercial de las reuniones con Bancolombia, Nemak, Alicorp y Vitro Industrial.',
              'Aprobar caso de éxito sectorial para compartir con prospectos que pidieron información previa.',
            ],
          };
        });
        const [newReportInputs, setNewReportInputs] = useState({ whatWasDone: '', currentPlan: '', nextSteps: '', clientQueries: '' });

        // Modals & Filters
        const [showFiltersBar, setShowFiltersBar] = useState(true);
        const [isMapperOpen, setIsMapperOpen] = useState(false);
        const [isSmartMergeOpen, setIsSmartMergeOpen] = useState(false);
        const [filters, setFilters] = useState(INITIAL_FILTERS);

        // Smart Merge Local State
        const [activeMergeField, setActiveMergeField] = useState('industria');
        const [selectedManualValues, setSelectedManualValues] = useState([]);
        const [manualTargetCategory, setManualTargetCategory] = useState('');
        const [editableSuggestions, setEditableSuggestions] = useState({});

        // Interactive Tables Local State
        const [meetingStatusFilter, setMeetingStatusFilter] = useState('ALL');
        const [tableSearch, setTableSearch] = useState('');
        const [draftFeedbacks, setDraftFeedbacks] = useState({});
        const [savedToastId, setSavedToastId] = useState(null);

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEYS.LEADS, JSON.stringify(baseLeads));
            localStorage.setItem(STORAGE_KEYS.RULES, JSON.stringify(mergeRules));
            localStorage.setItem(STORAGE_KEYS.DATASET_NAME, datasetName);
            localStorage.setItem(STORAGE_KEYS.BRANDING, JSON.stringify(branding));
            localStorage.setItem(STORAGE_KEYS.WEEKLY_REPORT, JSON.stringify(weeklyReport));
            localStorage.setItem(STORAGE_KEYS.THEME, darkMode ? 'dark' : 'light');
          } catch {}
        }, [baseLeads, mergeRules, datasetName, branding, weeklyReport, darkMode]);

        const normalizedLeads = useMemo(() => applyMergeRulesToLeads(baseLeads, mergeRules), [baseLeads, mergeRules]);
        const semanticSuggestions = useMemo(() => generateSemanticSuggestions(normalizedLeads), [normalizedLeads]);
        const { currentLeads, previousLeads } = useMemo(() => filterLeads(normalizedLeads, filters), [normalizedLeads, filters]);
        const aggregations = useMemo(() => calculateDashboardAggregations(currentLeads, previousLeads), [currentLeads, previousLeads]);

        const uniqueCountries = useMemo(() => Array.from(new Set(normalizedLeads.map((l) => l.pais))).sort(), [normalizedLeads]);
        const uniqueIndustries = useMemo(() => Array.from(new Set(normalizedLeads.map((l) => l.industria))).sort(), [normalizedLeads]);
        const uniqueRoles = useMemo(() => Array.from(new Set(normalizedLeads.map((l) => l.cargo))).sort(), [normalizedLeads]);

        // Upload CSV Handler
        const handleFileUpload = (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: (results) => {
              const headers = results.meta.fields || Object.keys(results.data[0] || {});
              setRawHeaders(headers);
              setRawRows(results.data);
              setColumnMapping(autoDetectColumns(headers));
              setDatasetName(file.name);
              setIsMapperOpen(true);
            },
          });
          e.target.value = '';
        };

        // Upload Institutional Logo Handler (Base64 DataURL)
        const handleLogoUpload = (which, e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            setBranding((prev) => ({
              ...prev,
              [which === 'client' ? 'clientLogoUrl' : 'agencyLogoUrl']: String(reader.result || ''),
            }));
          };
          reader.readAsDataURL(file);
          e.target.value = '';
        };

        const handleOpenMapperManual = () => {
          if (rawHeaders.length === 0) {
            const parsedCsv = Papa.parse(SAMPLE_CSV_CONTENT, { header: true, skipEmptyLines: true });
            const headers = parsedCsv.meta.fields || [];
            setRawHeaders(headers);
            setRawRows(parsedCsv.data);
            setColumnMapping(autoDetectColumns(headers));
          }
          setIsMapperOpen(true);
        };

        const handleConfirmMapping = (openMergeAfter) => {
          if (rawRows.length > 0) {
            setBaseLeads(buildLeadsFromRawRows(rawRows, columnMapping));
          }
          setIsMapperOpen(false);
          if (openMergeAfter) setIsSmartMergeOpen(true);
        };

        // Smart Merge Actions
        const handleAcceptSuggestion = (sug) => {
          const target = (editableSuggestions[sug.id] ?? sug.suggestedCategory).trim();
          if (!target) return;
          setMergeRules((prev) => [
            ...prev,
            {
              id: `auto-${sug.id}-${Date.now()}`,
              field: sug.field,
              targetCategory: target,
              sourceValues: sug.matchedValues.map((m) => m.value),
              autoGenerated: true,
            },
          ]);
        };

        const handleApplyAllSuggestions = () => {
          const batch = semanticSuggestions.map((sug, idx) => ({
            id: `batch-${Date.now()}-${idx}`,
            field: sug.field,
            targetCategory: sug.suggestedCategory,
            sourceValues: sug.matchedValues.map((m) => m.value),
            autoGenerated: true,
          }));
          setMergeRules((prev) => [...prev, ...batch]);
        };

        const handleManualMergeSubmit = (e) => {
          e.preventDefault();
          if (selectedManualValues.length === 0 || !manualTargetCategory.trim()) return;
          const underlying = new Set(selectedManualValues);
          for (const l of normalizedLeads) {
            const cur = activeMergeField === 'industria' ? l.industria : activeMergeField === 'cargo' ? l.cargo : l.pais;

                  </div>

                  <div className="p-6 overflow-y-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div className="lg:col-span-7 space-y-4">
                      <div className={`rounded-2xl border p-4 ${darkMode ? 'border-slate-800' : 'border-slate-200'}`}>
                        <h3 className="text-sm font-bold mb-3">1. Normalización Automática / Sugerida</h3>
                        {semanticSuggestions.filter((s) => s.field === activeMergeField).length === 0 ? (
                          <div className="p-4 rounded-xl bg-emerald-500/10 text-emerald-500 text-xs font-semibold">
                            ✓ Todas las variaciones detectadas para {activeMergeField} están normalizadas.
                          </div>
                        ) : (
                          <div className="space-y-3">
                            {semanticSuggestions
                              .filter((s) => s.field === activeMergeField)
                              .map((sug) => {
                                const currentTarget = editableSuggestions[sug.id] ?? sug.suggestedCategory;
                                return (
                                  <div key={sug.id} className="p-3.5 rounded-xl bg-indigo-500/10 border border-indigo-500/30 space-y-2">
                                    <span className="text-[11px] font-semibold text-indigo-400 block">{sug.reason}</span>
                                    <div className="flex flex-wrap gap-1.5">
                                      {sug.matchedValues.map((m) => (
                                        <span key={m.value} className={`px-2 py-0.5 rounded-lg border text-xs font-medium ${darkMode ? 'bg-slate-900 border-slate-700' : 'bg-white border-slate-200'}`}>
                                          &ldquo;{m.value}&rdquo; ({m.count})
                                        </span>
                                      ))}
                                    </div>
                                    <div className="flex items-center gap-2 pt-2">
                                      <input
                                        type="text"
                                        value={currentTarget}
                                        onChange={(e) => setEditableSuggestions((p) => ({ ...p, [sug.id]: e.target.value }))}
                                        className={`flex-1 px-3 py-1.5 rounded-lg border text-xs font-bold ${darkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-indigo-300'}`}
                                      />
                                      <button onClick={() => handleAcceptSuggestion(sug)} className="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold cursor-pointer">
                                        ✓ Unificar
                                      </button>
                                    </div>
                                  </div>
                                );
                              })}
                          </div>
                        )}
                      </div>

                      <div className={`rounded-2xl border p-4 ${darkMode ? 'border-slate-800' : 'border-slate-200'}`}>
                        <div className="flex items-center justify-between mb-2">
                          <h3 className="text-sm font-bold">Reglas de Consolidación Activas ({mergeRules.length})</h3>
                          {mergeRules.length > 0 && (
                            <button onClick={() => setMergeRules([])} className="text-xs text-rose-500 font-semibold cursor-pointer">
                              Restaurar originales
                            </button>
                          )}
                        </div>
                        <div className="space-y-1.5 max-h-36 overflow-y-auto">
                          {mergeRules.map((r) => (
                            <div key={r.id} className={`flex items-center justify-between p-2 rounded-xl border text-xs ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-slate-50 border-slate-200'}`}>
                              <span><strong>{r.targetCategory}</strong> ← {r.sourceValues.join(', ')}</span>
                              <button onClick={() => setMergeRules((p) => p.filter((x) => x.id !== r.id))} className="text-rose-500 font-bold px-2 cursor-pointer">✕</button>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    <div className={`lg:col-span-5 rounded-2xl border p-4 flex flex-col ${darkMode ? 'border-slate-800' : 'border-slate-200'}`}>
                      <h3 className="text-sm font-bold mb-1">2. Agrupación Manual (Merge de Coincidencias)</h3>
                      <p className="text-xs text-slate-400 mb-3">Selecciona múltiples variaciones y consolídalas bajo una etiqueta:</p>
                      <div className="flex-1 max-h-56 overflow-y-auto space-y-1.5 pr-1 mb-3">
                        {mergeFieldValueCounts.map((item) => {
                          const checked = selectedManualValues.includes(item.val);
                          return (
                            <label key={item.val} className={`flex items-center justify-between p-2 rounded-xl border text-xs cursor-pointer ${checked ? 'bg-blue-500/20 border-blue-500 font-bold' : darkMode ? 'border-slate-800' : 'border-slate-200'}`}>
                              <div className="flex items-center gap-2">
                                <input
                                  type="checkbox"
                                  checked={checked}
                                  onChange={() =>
                                    setSelectedManualValues((p) =>
                                      p.includes(item.val) ? p.filter((x) => x !== item.val) : [...p, item.val]
                                    )
                                  }
                                />
                                <span>{item.val}</span>
                              </div>
                              <span className="text-[11px] text-slate-400">{item.count} reg.</span>
                            </label>
                          );
                        })}
                      </div>
                      <form onSubmit={handleManualMergeSubmit} className="space-y-2">
                        <input
                          type="text"
                          value={manualTargetCategory}
                          onChange={(e) => setManualTargetCategory(e.target.value)}
                          placeholder="Etiqueta única (ej. Manufactura)..."
                          className={`w-full px-3 py-2 rounded-xl border text-xs font-semibold ${darkMode ? 'bg-slate-900 border-slate-700 text-white' : 'bg-white border-slate-300'}`}
                        />
                        <button
                          type="submit"
                          disabled={selectedManualValues.length === 0 || !manualTargetCategory.trim()}
                          className="w-full py-2.5 rounded-xl bg-blue-600 disabled:bg-slate-500/20 text-white text-xs font-bold cursor-pointer"
                        >
                          ＋ Consolidar Variaciones ({selectedManualValues.length})
                        </button>
                      </form>
                    </div>
                  </div>

                  <div className="px-6 py-4 border-t border-slate-200 dark:border-slate-800 flex justify-between items-center">
                    <button onClick={() => setIsSmartMergeOpen(false)} className="px-4 py-2 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-semibold cursor-pointer">
                      Saltar / Omitir Normalización
                    </button>
                    <button onClick={() => setIsSmartMergeOpen(false)} className="px-5 py-2.5 rounded-xl bg-blue-600 text-white text-xs font-bold cursor-pointer">
                      Aplicar y Ver Gráficos →
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ========================================================================== */}
            {/* MODAL: DUAL BRANDING LOGOS CONFIGURATION */}
            {/* ========================================================================== */}
            {showBrandingModal && (
              <div className="fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
                <div className={`rounded-3xl border shadow-2xl max-w-lg w-full p-6 space-y-4 ${cardClass}`}>
                  <div className="flex items-center justify-between">
                    <h3 className="text-base font-extrabold">Personalización de Branding (2 Logos Institucionales)</h3>
                    <button onClick={() => setShowBrandingModal(false)} className="text-slate-400 cursor-pointer">✕</button>
                  </div>
                  <p className="text-xs text-slate-400">
                    Configura el nombre y sube la imagen del Logo del Cliente y el Logo de la Agencia/Proveedor. Aparecerán en la esquina superior derecha y en las exportaciones HD.
                  </p>
                  <div className="space-y-3">
                    <div className={`p-3.5 rounded-2xl border ${darkMode ? 'border-slate-800' : 'border-slate-200'}`}>
                      <label className="block text-xs font-bold mb-1">1. Nombre y Logo del Cliente</label>
                      <input
                        type="text"
                        value={branding.clientName}
                        onChange={(e) => setBranding((p) => ({ ...p, clientName: e.target.value }))}
                        className={`w-full px-3 py-1.5 rounded-xl border text-xs font-semibold mb-2 ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'}`}
                      />
                      <input ref={clientLogoInputRef} type="file" accept="image/*" onChange={(e) => handleLogoUpload('client', e)} className="hidden" />
                      <div className="flex items-center gap-2">
                        <button onClick={() => clientLogoInputRef.current?.click()} className="px-3 py-1.5 rounded-xl bg-blue-600 text-white text-xs font-bold cursor-pointer">
                          Subir Imagen Logo Cliente
                        </button>
                        {branding.clientLogoUrl && (
                          <button onClick={() => setBranding((p) => ({ ...p, clientLogoUrl: '' }))} className="text-xs text-rose-500 cursor-pointer">
                            Quitar imagen
                          </button>
                        )}
                      </div>
                    </div>

                    <div className={`p-3.5 rounded-2xl border ${darkMode ? 'border-slate-800' : 'border-slate-200'}`}>
                      <label className="block text-xs font-bold mb-1">2. Nombre y Logo de Agencia / Proveedor</label>
                      <input
                        type="text"
                        value={branding.agencyName}
                        onChange={(e) => setBranding((p) => ({ ...p, agencyName: e.target.value }))}
                        className={`w-full px-3 py-1.5 rounded-xl border text-xs font-semibold mb-2 ${darkMode ? 'bg-slate-800 border-slate-700 text-white' : 'bg-slate-50 border-slate-200'}`}
                      />
                      <input ref={agencyLogoInputRef} type="file" accept="image/*" onChange={(e) => handleLogoUpload('agency', e)} className="hidden" />
                      <div className="flex items-center gap-2">
                        <button onClick={() => agencyLogoInputRef.current?.click()} className="px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold cursor-pointer">
                          Subir Imagen Logo Agencia
                        </button>
                        {branding.agencyLogoUrl && (
                          <button onClick={() => setBranding((p) => ({ ...p, agencyLogoUrl: '' }))} className="text-xs text-rose-500 cursor-pointer">
                            Quitar imagen
                          </button>
                        )}
                      </div>
                    </div>
                  </div>
                  <div className="flex justify-end pt-2">
                    <button onClick={() => setShowBrandingModal(false)} className="px-5 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold cursor-pointer">
                      Guardar Branding
                    </button>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
